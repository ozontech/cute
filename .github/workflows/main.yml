name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run golangci-lint
        # for settings see https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@v6
        with:
          # last v1.x release; supports Go 1.24 and the current v1-format .golangci.yaml
          version: v1.64.8
          only-new-issues: true
          # golangci-lint command line arguments
          args: --timeout=5m0s

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run examples
        run: make example
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ./examples/allure-results